<header class="header">
  <div class="header-left">
    <div class="search-box">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text"
             class="search-input"
             placeholder="Ara... (⌘K)"
             [value]="searchQuery()"
             (input)="searchQuery.set($any($event.target).value)">
    </div>
  </div>

  <div class="header-right">
    <!-- Notifications -->
    <button class="header-btn" (click)="toggleNotifications()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span class="notification-dot"></span>
    </button>

    <!-- Profile quick view -->
    <div class="header-user">
      <div class="header-avatar" [style.background]="'linear-gradient(135deg, #6366f1, #8b5cf6)'">
        {{ auth.displayName().charAt(0).toUpperCase() }}
      </div>
      <div class="header-user-info">
        <span class="header-user-name">{{ auth.displayName() }}</span>
        <span class="header-user-role">
          @switch (auth.userRole()) {
            @case ('ADMIN') { Yönetici }
            @case ('CORPORATE') { Kurumsal }
            @case ('INDIVIDUAL') { Bireysel }
          }
        </span>
      </div>
    </div>
  </div>
</header>
