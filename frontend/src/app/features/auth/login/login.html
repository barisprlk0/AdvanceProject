<div class="login-container fade-in">
  <h1 class="auth-title">Hoş geldiniz</h1>
  <p class="auth-description">Devam etmek için hesabınıza giriş yapın.</p>

  @if (errorMessage()) {
    <div class="alert alert-error">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="15" y1="9" x2="9" y2="15"/>
        <line x1="9" y1="9" x2="15" y2="15"/>
      </svg>
      <span>{{ errorMessage() }}</span>
    </div>
  }

  <form (ngSubmit)="onSubmit()" class="auth-form">
    <div class="form-group">
      <label class="form-label" for="email">E-posta Adresi</label>
      <div class="input-wrapper">
        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
        <input
          id="email"
          type="email"
          class="form-input has-icon"
          placeholder="ornek@firma.com"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          name="email"
          autocomplete="email">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Şifre</label>
      <div class="input-wrapper">
        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <input
          id="password"
          [type]="showPassword() ? 'text' : 'password'"
          class="form-input has-icon"
          placeholder="••••••••"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          name="password"
          autocomplete="current-password">
        <button type="button" class="input-action" (click)="togglePassword()">
          @if (showPassword()) {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          } @else {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          }
        </button>
      </div>
    </div>

    <div class="form-row">
      <label class="checkbox-label">
        <input type="checkbox" class="checkbox">
        <span>Beni hatırla</span>
      </label>
      <a href="#" class="forgot-link">Şifremi unuttum</a>
    </div>

    <button type="submit" class="btn btn-primary btn-lg btn-full" [disabled]="isLoading()">
      @if (isLoading()) {
        <span class="spinner"></span>
        <span>Giriş yapılıyor...</span>
      } @else {
        <span>Giriş Yap</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"/>
          <polyline points="12 5 19 12 12 19"/>
        </svg>
      }
    </button>
  </form>

  <div class="auth-divider">
    <span>veya</span>
  </div>

  <p class="auth-switch">
    Hesabınız yok mu?
    <a routerLink="/register" class="auth-switch-link">Kayıt olun</a>
  </p>

  <div class="demo-hint">
    <p class="demo-title">Demo Hesaplar</p>
    <div class="demo-accounts">
      <button class="demo-btn" (click)="email.set('admin@shoplens.com'); password.set('demo123')">
        <span class="demo-role">Admin</span>
        <span class="demo-email">admin&#64;shoplens.com</span>
      </button>
      <button class="demo-btn" (click)="email.set('corp@shoplens.com'); password.set('demo123')">
        <span class="demo-role">Kurumsal</span>
        <span class="demo-email">corp&#64;shoplens.com</span>
      </button>
      <button class="demo-btn" (click)="email.set('user@shoplens.com'); password.set('demo123')">
        <span class="demo-role">Bireysel</span>
        <span class="demo-email">user&#64;shoplens.com</span>
      </button>
    </div>
  </div>
</div>
